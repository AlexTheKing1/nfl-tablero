<title>Tablero NFL · semana 07</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFBFF;--line:#D1D3C4;--ink:#2F3E46;--ink2:#354F52;--g:#52796F;--a:#B5772E;--r:#8A8D80;--tint:rgba(209,211,196,.28);
--num:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;--ser:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* barra superior */
.top{background:var(--ink);color:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:46px}
.brand{font:700 20px/1 var(--num);letter-spacing:.08em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd{background:var(--tint);border-bottom:1px solid var(--line);font:500 13px/1.3 var(--sans);color:var(--ink2)}
.upd .wrap{padding-top:5px;padding-bottom:5px}
.upd b{font-weight:600}
.brand small{font-weight:500;opacity:.75;margin-left:8px;letter-spacing:.06em}
.nav{display:flex;gap:2px}
.nav button{border:0;background:none;color:var(--bg);font:600 15px var(--num);letter-spacing:.08em;text-transform:uppercase;padding:14px 10px;white-space:nowrap;opacity:.7;border-bottom:3px solid transparent}
.nav button[aria-current=true]{opacity:1;border-bottom-color:var(--bg)}
.back{border:0;background:none;color:var(--bg);font:600 15px var(--num);letter-spacing:.08em;text-transform:uppercase;padding:8px 0;white-space:nowrap;flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis}
main{padding-bottom:48px}
/* encabezados de sección */
.sec{font:700 18px/1 var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.tag.pr{border-color:var(--a)}
.sec small{font:500 13px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink2);margin-left:8px}
.note{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink2);font-size:13px}
.pan{border:1px solid var(--line);background:var(--bg);margin-bottom:12px}
/* equipos */
.tm{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;line-height:1.2}
.tm i{display:block;flex:none;width:5px;height:1em;background:var(--c,var(--line));border-radius:1px}
.tm b{font:700 1.1em/1.2 var(--num);letter-spacing:.04em}
/* Semana */
.legs{display:grid;grid-template-columns:minmax(0,1fr)}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px}
.row.rk{grid-template-columns:28px minmax(0,1fr) auto}
.legs .row:last-child{border-bottom:0}
.rkn{font:600 22px var(--num);color:var(--ink2)}
.pkl{min-width:0}
.pkl .nm{font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkl .l2{font-size:13px;color:var(--ink2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkl .tgs{white-space:normal}
.pkv{text-align:right;white-space:nowrap;line-height:1.1}
.pkv .u{font:600 18px var(--num);letter-spacing:.02em;color:var(--ink);margin-right:8px}
.pkv .mj{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.big{font:700 24px/1 var(--num)}
.big.g{color:var(--g)}.big.a{color:var(--a)}.big.r{color:var(--r)}
.day{font:700 15px var(--num);letter-spacing:.1em;text-transform:uppercase;background:var(--tint);padding:6px 10px;margin-top:14px;border-top:2px solid var(--ink)}
.gm{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 10px;align-items:center}
.gm .tt{font-size:19px}
.gm .mt{font:600 15px var(--num);letter-spacing:.04em;color:var(--ink2);text-align:right;white-space:nowrap}
.gm .sub{grid-column:1/-1;font-size:13px;color:var(--ink2)}
/* pastillas (texto oscuro; el color va en el punto) */
.pl{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--num);letter-spacing:.03em;padding:3px 9px;border-radius:3px;white-space:nowrap;background:var(--tint);color:var(--ink)}
.pl i{width:9px;height:9px;border-radius:50%;flex:none}
.pl.g{background:rgba(82,121,111,.16)}.pl.g i{background:var(--g)}
.pl.a{background:rgba(181,119,46,.16)}.pl.a i{background:var(--a)}
.pl.r{background:rgba(138,141,128,.2)}.pl.r i{background:var(--r)}
.none{font-size:12px;color:var(--ink2);line-height:1.2}
.tag{display:inline-block;font:600 12px var(--num);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink2);color:var(--ink2);padding:1px 6px;border-radius:2px;margin:3px 4px 0 0}
/* encabezado TV */
.tv{background:var(--ink);color:var(--bg)}
.tvin{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:18px 0 6px}
.tt1{display:flex;align-items:center;gap:12px;min-width:0}
.tt1.a{justify-self:end;flex-direction:row;text-align:right}
.tt1.h{justify-self:start;flex-direction:row-reverse;text-align:left}
.tt1 .st{width:9px;align-self:stretch;min-height:62px;flex:none;background:var(--c);border-radius:1px;box-shadow:0 0 0 1px rgba(251,251,255,.5)}
.tt1 .ab{font:700 66px/.95 var(--num);letter-spacing:.02em}
.tt1 .nmx{font-size:14px;opacity:.85}
.tt1 .rc{font:600 22px/1 var(--num);letter-spacing:.04em}
.tvat{font:600 26px/1 var(--num);opacity:.7;text-align:center}
.tvd{text-align:center;font:600 16px/1.3 var(--num);letter-spacing:.08em;text-transform:uppercase;padding:2px 0 8px}
.tvm{display:flex;gap:8px 22px;flex-wrap:wrap;justify-content:center;border-top:1px solid rgba(251,251,255,.25);padding:10px 0 14px}
.tvm div{font:600 17px var(--num);letter-spacing:.04em}
.tvm span{font-weight:500;font-size:13px;letter-spacing:.1em;opacity:.7;margin-right:6px;text-transform:uppercase}
/* layout de partido */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 28px}
.lect h3{font:700 27px/1.15 var(--ser);margin:4px 0 8px}
.lect p{margin:6px 0;font-size:16px}
table{border-collapse:collapse;width:100%}
.pt th{font:600 13px var(--num);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:right;padding:6px 4px;border-bottom:2px solid var(--ink)}
.pt th:first-child{text-align:left}
.pt td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.pt td:first-child{text-align:left}
.pt tr.cl{cursor:pointer}
.pt td.n{font:600 20px var(--num)}
.pt .pj{font-weight:600}
.pt .rl{font:600 13px var(--num);letter-spacing:.06em;color:var(--ink2);margin-right:6px}
.pt td.pi{width:104px}
.bx{font-size:14px}
.bx th{font:600 12px var(--num);letter-spacing:.08em;color:var(--ink2);text-align:right;padding:4px 3px;border-bottom:1px solid var(--ink)}
.bx th:first-child{text-align:left}
.bx td{padding:5px 3px;border-bottom:1px solid var(--line);text-align:right}
.bx td:first-child{text-align:left}
.bx tr.cl{cursor:pointer}
.bx h4{font:700 14px var(--num);letter-spacing:.1em;text-transform:uppercase;margin:12px 0 2px;color:var(--ink2)}
.stg{display:block}
.stabs{display:flex;gap:6px;margin-bottom:8px}
.stabs button{flex:1;border:1px solid var(--ink);background:none;font:600 16px var(--num);letter-spacing:.08em;padding:6px;text-transform:uppercase}
.stabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.stm{display:none}.stm.on{display:block}
.mkt{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.mkt button{border:1px solid var(--ink);background:none;font:600 15px var(--num);letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;white-space:nowrap}.mkt button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sd .sec:first-child{margin-top:26px}
.cp td,.cp th{padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px;text-align:right}
.cp th{font:600 14px var(--num);letter-spacing:.08em;color:var(--ink);border-bottom:2px solid var(--ink)}
.cp td:first-child,.cp th:first-child{text-align:left;color:var(--ink2)}
.rb{display:inline-block;min-width:34px;text-align:center;font:600 14px/1 var(--num);letter-spacing:.04em;padding:3px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.rb.best{font-weight:700;box-shadow:inset 0 0 0 1px currentColor}
.rb.v{background:#DCE8E3;color:#2E5247}.rb.m{background:#ECEDE5;color:#4A5558}.rb.o{background:#F2E2CC;color:#7A4E14}
.cp b{font-weight:700}
.u5 .it{display:flex;gap:9px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.u5 .it:last-child{border-bottom:0}
.res{font:700 17px var(--num);width:24px;height:24px;line-height:24px;text-align:center;color:var(--bg);border-radius:2px;flex:none}
.res.G{background:var(--g)}.res.P{background:var(--r)}.res.E{background:var(--a)}
.lz .it{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.lz .it span:last-child{font:600 13px var(--num);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.h5{font:700 15px var(--num);letter-spacing:.1em;text-transform:uppercase;margin:12px 0 4px;color:var(--ink2)}
/* jugador */
.hero{padding:22px 0 18px}
.hero h2{font:700 44px/1.08 var(--ser);margin:0 0 6px}
.hero .ln{display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;font:600 20px/1.3 var(--num);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.hero .ln>*{font:inherit;line-height:1.3}
.hero .ln .tm b{font:inherit;font-weight:700;color:var(--ink)}
.pcols{display:grid;grid-template-columns:minmax(0,1fr);gap:40px}
.ppan{background:#F4F5EF;border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:24px;min-width:0}
.ppan h2.pt2{font:700 18px/1 var(--num);letter-spacing:.1em;text-transform:uppercase;margin:0;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.ppan h3{font:700 15px var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
.ppan .sc>*:last-child{margin-bottom:0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;text-align:center}
.three div{border:1px solid var(--line);background:var(--bg);padding:10px 4px 8px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;min-height:104px}
.three .l-short{display:none}
.three b{display:block;font:700 54px/1 var(--num)}
.three span{font:600 14px var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.three .mid b{color:var(--g)}
.lad{display:grid;grid-template-columns:44px minmax(0,1fr) 42px 50px 50px;gap:8px;align-items:center;margin:2px -10px;padding:5px 10px;border:1px solid transparent;font-size:15px}
.lad .u{font:600 20px var(--num)}
.lad .mj{font-size:12px;color:var(--ink2);text-align:right}
.lad.pk{background:rgba(82,121,111,.13);border-color:var(--g)}
.lad.pk .u,.lad.pk .pp{font-weight:700}
.lad.pk .u{font-weight:700}
.tr{height:14px;background:rgba(209,211,196,.55);border-radius:2px;overflow:hidden}
.tr i{display:block;height:100%}
.f-g{background:var(--g)}.f-a{background:var(--a)}.f-r{background:var(--r)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:600 16px var(--num);letter-spacing:.03em;padding:4px 10px;background:rgba(138,141,128,.2);border-left:4px solid var(--r)}
.chip.ok{background:rgba(82,121,111,.16);border-left-color:var(--g)}
.btn{border:2px solid var(--ink);background:none;font:700 16px var(--num);letter-spacing:.1em;text-transform:uppercase;padding:9px 16px}
.btn.solid{background:var(--ink);color:var(--bg)}
.cap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.cap label{font:600 13px var(--num);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cap input{width:100%;font:inherit;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cap input.err{border-color:var(--a);border-width:2px}
.out{display:none;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:14px;margin:12px 0}
.out div{display:flex;justify-content:space-between;gap:6px}.pos{font-weight:700;color:var(--g)}
.vd{font:700 26px/1.15 var(--ser);margin:16px 0 4px}
.vd.g{color:var(--g)}.vd.r{color:var(--r)}.vd.a{color:var(--a)}
.hip{font-size:12px;color:var(--ink2);margin:0 0 6px;font-style:italic}
.lado{border:1px solid var(--line);background:var(--bg);padding:10px 12px;margin-top:8px;font-size:14px;line-height:1.4}
.lado .h{font:700 17px var(--num);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.lado .s{color:var(--ink2);font-size:13px;margin-top:2px}
.aviso{border-left:4px solid var(--a);background:rgba(181,119,46,.12);padding:8px 12px;font-size:13px;margin-top:8px}
.lad.ln{background:rgba(181,119,46,.13);border:1px dashed var(--a)}
.lad.ln .u,.lad.ln .pp{font-weight:700}
.hid{display:none!important}
.cal-b{display:block;max-width:420px}
@media(min-width:900px){
 .pcols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .legs.dos{grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column}
 .legs.dos .row:nth-child(n+6){border-left:1px solid var(--line)}
 .legs.dos .row:nth-child(5),.legs.dos .row:nth-child(10){border-bottom:0}
 .cols{grid-template-columns:minmax(0,1fr) 340px}
 .stg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
 .stabs{display:none}.stm{display:block}
 .tt1 .ab{font-size:92px}
}
@media(max-width:560px){
 .brand small{display:none}
 .tt1 .ab{font-size:48px}.tt1 .st{min-height:46px;width:7px}.tt1 .nmx{font-size:12px;line-height:1.2}.tt1{gap:8px}.tt1 .rc{font-size:18px}
 .nav button{padding:14px 8px}
 .three span{letter-spacing:.03em;font-size:13px}.three .l-long{display:none}.three .l-short{display:inline}
 .pt td.pi{width:84px}
 .lad{grid-template-columns:34px minmax(0,1fr) 36px 42px 42px;gap:5px}
 .big{font-size:30px}
}
</style></head><body>

<div class="upd"><div class="wrap" id="upd"></div></div>
<div id="tvh"></div>
<main><div class="wrap" id="app"></div></main>

function ruta(){
 const app=document.getElementById("app"),tvh=document.getElementById("tvh");app.replaceChildren();tvh.replaceChildren();window.scrollTo(0,0);
 const h=location.hash.slice(1),back=document.getElementById("back"),brand=document.getElementById("brand");

 const volver=(txt,fn)=>{back.textContent="← "+txt;back.classList.remove("hid");back.onclick=fn;brand.classList.add("hid")};
 if(h==="cal"){n=2;vistaCal(app)}
 else if(h.startsWith("g/")&&G[h.slice(2)]){const g=G[h.slice(2)];n=0;volver("Semana "+D.semana,()=>go(""));tvh.append(encabezado(g));vistaPartido(app,g)}
 else if(h.startsWith("j/")&&JI[+h.slice(2)]){const j=JI[+h.slice(2)];const gj=G[j.game_id];n=0;volver(gj?gj.away+" @ "+gj.home:j.equipo,()=>go("g/"+j.game_id));vistaJugador(app,j)}
 else vistaSemana(app);
 document.getElementById("n1").setAttribute("aria-current",n===1);document.getElementById("n2").setAttribute("aria-current",n===2)}
document.getElementById("n1").onclick=()=>go("");document.getElementById("n2").onclick=()=>go("cal");
